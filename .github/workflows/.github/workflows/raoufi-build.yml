name: RAOUFI build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Show available npm scripts
        run: npm run || true

      - name: Build
        run: |
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No 'build' script in package.json. Check the list above and edit this step."
            exit 1
          fi

      - name: Collect packages
        run: |
          mkdir -p raoufi-out
          find . -path ./node_modules -prune -o \( -name "*.zip" -o -name "*.pkg" \) -type f -print \
            | grep -v node_modules | xargs -I{} cp --parents {} raoufi-out/ || true
          ls -R raoufi-out | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: raoufi-package
          path: raoufi-out/
          if-no-files-found: error
