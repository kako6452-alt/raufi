name: RAOUFI build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:dev

      - name: Show output files
        run: ls -R dist | head -80

      - name: Collect packages
        run: |
          mkdir -p raoufi-out
          find . -path ./node_modules -prune -o \( -name "*.zip" -o -name "*.pkg" \) -type f -print \
            | grep -v node_modules | xargs -I{} cp --parents {} raoufi-out/ || true
          ls -R raoufi-out | head -50

      - uses: actions/upload-artifact@v4
        with:
          name: raoufi-package
          path: raoufi-out/
          if-no-files-found: error
